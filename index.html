<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trade Heaven - B2B Marketplace</title>
    <!-- Preconnect resource hints for extreme image loading performance (LCP) -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <!-- Preload critical Largest Contentful Paint (LCP) assets responsively -->
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=800&q=80" media="(max-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=1600&q=80" media="(min-width: 769px)" fetchpriority="high" />
    <!-- Failsafe fetch interceptor shim to prevent browser environment getter/setter conflicts on window.fetch -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var _nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
            var _activeFetch = _nativeFetch;
            var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (!desc || desc.configurable || !desc.set) {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return _activeFetch;
                },
                set: function(val) {
                  _activeFetch = typeof val === 'function' ? val : _activeFetch;
                },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {
          // Fallback gracefully
        }
      })();
    </script>
    <!-- Safe Client-Side Session Recovery Support -->
    <script>
      try {
        // Clear any truly corrupted or orphaned non-standard state, but preserve active sessions
        const keys = Object.keys(localStorage);
        for (const key of keys) {
          if (key.includes('corrupted') || key.includes('stale_temp_')) {
            localStorage.removeItem(key);
          }
        }
      } catch(e) {}
    </script>
    <link rel="icon" type="image/png" sizes="256x256" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Interactive B2B international trade marketplace platform." />
    <meta property="og:title" content="Trade Heaven - B2B Marketplace" />
    <meta property="og:description" content="Enterprise B2B trade engine." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  
    <!-- Google Translate Script (Deferred to prevent render-blocking) -->
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
          }, 'google_translate_element');
        }
      };

      (function() {
        var loadScript = function() {
          var script = document.createElement('script');
          script.type = 'text/javascript';
          script.async = true;
          script.defer = true;
          script.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
          document.body.appendChild(script);
        };
        if (window.addEventListener) {
          window.addEventListener('load', function() {
            setTimeout(loadScript, 1200);
          });
        } else {
          window.attachEvent('onload', loadScript);
        }
      })();
    </script>
  </head>
  <body class="overflow-x-hidden max-w-full bg-slate-50 text-slate-800 antialiased selection:bg-blue-600 selection:text-white">
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
