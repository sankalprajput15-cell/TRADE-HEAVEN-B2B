name: Deploy Website to BigRock via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    env:
      CLEAN_FTP_SERVER: tradeheaven.net
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: Copy Server Config Files to Dist
        run: |
          cp api.php dist/ 2>/dev/null || true
          cp .htaccess dist/ 2>/dev/null || true

      - name: Sanitize & Resolve FTP Server Host
        id: ftp_host
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[^/]*://||' -e 's|/.*$||' -e 's|:.*$||' | tr -d '[:space:]')
          if [ -z "$CLEAN_SERVER" ] || [ "$CLEAN_SERVER" = "localhost" ] || [ "$CLEAN_SERVER" = "127.0.0.1" ] || [[ "$CLEAN_SERVER" == 127.* ]] || [ "$CLEAN_SERVER" = "0.0.0.0" ] || [ "$CLEAN_SERVER" = "ftp.tradeheaven.net" ]; then
            CLEAN_SERVER="tradeheaven.net"
          fi
          echo "Target FTP Server Host: $CLEAN_SERVER"
          echo "server=$CLEAN_SERVER" >> "$GITHUB_OUTPUT"
          echo "CLEAN_FTP_SERVER=$CLEAN_SERVER" >> "$GITHUB_ENV"

      - name: Verify FTP Port Connectivity
        run: |
          TARGET="${{ steps.ftp_host.outputs.server || env.CLEAN_FTP_SERVER || 'tradeheaven.net' }}"
          echo "Probing FTP control socket on $TARGET:21..."
          python3 -c "import socket; s = socket.socket(); s.settimeout(8); s.connect(('$TARGET', 21)); banner = s.recv(1024).decode('utf-8', errors='ignore').strip(); print('FTP Server Banner:', banner); s.close()" || echo "Warning: Direct TCP probe failed, proceeding with FTP-Deploy-Action."

      - name: Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp_host.outputs.server || env.CLEAN_FTP_SERVER || 'tradeheaven.net' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          local-dir: ./dist/
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            site_content.json
            error_log
