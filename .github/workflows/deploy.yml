name: Deploy Website to BigRock via SFTP (Port 22)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy via SFTP
    runs-on: ubuntu-latest
    env:
      CLEAN_SFTP_SERVER: tradeheaven.net
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: Copy Server Config Files to Dist
        run: |
          cp api.php dist/ 2>/dev/null || true
          cp .htaccess dist/ 2>/dev/null || true

      - name: Sanitize & Resolve SFTP Server Host
        id: sftp_host
        run: |
          RAW_SERVER="${{ secrets.SFTP_HOST || secrets.FTP_SERVER }}"
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[^/]*://||' -e 's|/.*$||' -e 's|:.*$||' | tr -d '[:space:]')
          if [ -z "$CLEAN_SERVER" ] || [ "$CLEAN_SERVER" = "localhost" ] || [ "$CLEAN_SERVER" = "127.0.0.1" ] || [[ "$CLEAN_SERVER" == 127.* ]] || [ "$CLEAN_SERVER" = "0.0.0.0" ] || [ "$CLEAN_SERVER" = "ftp.tradeheaven.net" ]; then
            CLEAN_SERVER="tradeheaven.net"
          fi
          echo "Target SFTP Server Host: $CLEAN_SERVER"
          echo "server=$CLEAN_SERVER" >> "$GITHUB_OUTPUT"
          echo "CLEAN_SFTP_SERVER=$CLEAN_SERVER" >> "$GITHUB_ENV"

      - name: Verify SFTP / SSH Port 22 Connectivity
        run: |
          TARGET="${{ steps.sftp_host.outputs.server || env.CLEAN_SFTP_SERVER || 'tradeheaven.net' }}"
          echo "Probing SSH/SFTP control port on $TARGET:22..."
          python3 -c "import socket; s = socket.socket(); s.settimeout(8); s.connect(('$TARGET', 22)); banner = s.recv(1024).decode('utf-8', errors='ignore').strip(); print('SSH/SFTP Banner:', banner); s.close()" || echo "Warning: Direct TCP probe timed out, proceeding with deployment."

      - name: Deploy Files via SFTP (Port 22)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.sftp_host.outputs.server || env.CLEAN_SFTP_SERVER || 'tradeheaven.net' }}
          username: ${{ secrets.SFTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD || secrets.FTP_PASSWORD }}
          port: 22
          source: "dist/*"
          target: "public_html"
          strip_components: 1
          overwrite: true
          rm: false
