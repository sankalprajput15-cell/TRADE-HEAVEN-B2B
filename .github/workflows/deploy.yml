name: Auto Deploy to BigRock cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy React SPA & PHP API to BigRock cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: 📄 Copy api.php & .htaccess into dist
        run: |
          cp api.php dist/ 2>/dev/null || true
          cp .htaccess dist/ 2>/dev/null || true

      - name: 🚀 Sync Files via FTP to BigRock
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # NOTE: In GitHub Settings -> Secrets -> Actions:
          # FTP_SERVER must be raw host/IP only (e.g. 'ftp.tradeheaven.net' or '103.xxx.xxx.xxx') WITHOUT 'ftp://' or 'http://'
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false
          security: loose

