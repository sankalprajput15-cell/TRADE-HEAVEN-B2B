name: Deploy Website to BigRock via FTPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy via FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: Copy Server Config Files to Dist
        run: |
          cp api.php dist/ 2>/dev/null || true
          cp .htaccess dist/ 2>/dev/null || true

      - name: Deploy to BigRock
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          timeout: 180000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            site_content.json
            error_log
