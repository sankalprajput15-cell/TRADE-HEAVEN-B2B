<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="780" height="200">
  <!-- Square TH Monogram Box matching tradeheavenbg1.png -->
  <g transform="translate(10, 10)">
    <rect width="180" height="180" fill="#FFFFFF" stroke="#000000" stroke-width="4" rx="12"/>
    <g fill="#000000">
      <!-- Letter T -->
      <path d="M 23 48 H 86 V 65 H 63 V 132 H 46 V 65 H 23 Z"/>
      <!-- Letter H -->
      <path d="M 93 48 H 111 V 81 H 139 V 48 H 157 V 132 H 139 V 99 H 111 V 132 H 93 Z"/>
    </g>
  </g>

  <!-- Wordmark Text -->
  <text x="216" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="58" fill="#0f172a" letter-spacing="-1">
    TRADE <tspan fill="#000000">HEAVEN</tspan>
  </text>
  
  <!-- B2B Badge -->
  <rect x="650" y="60" width="60" height="30" rx="6" fill="#0f172a"/>
  <text x="680" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" fill="#ffffff" text-anchor="middle">
    B2B
  </text>

  <!-- Subtitle -->
  <text x="218" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#64748b" letter-spacing="2">
